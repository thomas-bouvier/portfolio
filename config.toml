baseURL = "https://thomas-bouvier.io/"
languageCode = "en"
title = "Thomas Bouvier"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

[module]
  [[module.imports]]
    # project theme as a go module
    path = "github.com/thomas-bouvier/gohugo-theme-otomo"

[params]
  logo = "Thomas Bouvier"
  description = "Using digital technology for a sustainable and better-informed society 🌿"
  images = ['avatar.png']

  [params.highlight]
    [params.highlight.copy]
      enable = true
      # hover | always
      display = "hover"

[taxonomies]
  tag = "tags"

[languages]

  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    weight = 1

    [[languages.en.menu.main]]
      identifier = "posts"
      name = "Blog"
      url = "/posts/"
      weight = 0
    [[languages.en.menu.main]]
      identifier = "research"
      name = "Research"
      url = "/research/"
      weight = 1
    [[languages.en.menu.main]]
      identifier = "projects"
      name = "Projects"
      url = "/projects/"
      weight = 2
    [[languages.en.menu.main]]
      identifier = "about"
      name = "About me"
      url = "/about/"
      weight = 3

  [languages.fr]
    languageName = "Français"
    languageCode = "fr-FR"
    weight = 2
    description = "Utiliser le numérique pour une société durable et mieux informée 🌿"

    [[languages.fr.menu.main]]
      identifier = "posts"
      name = "Blog"
      url = "/posts/"
      weight = 0
    [[languages.fr.menu.main]]
      identifier = "research"
      name = "Recherche"
      url = "/research/"
      weight = 1
    [[languages.fr.menu.main]]
      identifier = "projects"
      name = "Projets"
      url = "/projects/"
      weight = 2
    [[languages.fr.menu.main]]
      identifier = "about"
      name = "À propos"
      url = "/a-propos/"
      weight = 3

[privacy]
  [privacy.youtube]
    disable = false
    privacyEnhanced = true

[markup]
  [markup.highlight]
    noClasses = false
