baseURL = "https://thomas-bouvier.io/"
locale = "en"
title = "Thomas Bouvier"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

[module]
  [[module.imports]]
    # project theme as a go module
    path = "github.com/thomas-bouvier/gohugo-theme-otomo"

[params]
  logo = "Thomas Bouvier"
  description = "PhD | Co-founder of Odeai"
  images = ['avatar.png']

  [params.highlight]
    [params.highlight.copy]
      enable = true
      # hover | always
      display = "hover"

  # Structured data (JSON-LD) describing the person behind this website,
  # printed on the home page by the seo/jsonld.html theme partial.
  [params.person]
    name = "Thomas Bouvier"
    description = "PhD in high-performance computing (HPC), co-founder of Odeai, working at the intersection of AI, HPC and data engineering."
    image = "avatar.png"
    email = "contact@thomas-bouvier.io"
    jobTitle = "Co-founder of Odeai"
    knowsAbout = [
      "High Performance Computing (HPC)",
      "Artificial Intelligence",
      "Weather Nowcasting",
      "Distributed Machine Learning",
      "GPU Optimization"
    ]
    sameAs = [
      "https://github.com/thomas-bouvier",
      "https://www.linkedin.com/in/thomas-bouvier/",
      "https://mu.social/profile/thomas-bouvier.io",
      "https://cv.hal.science/thomas-bouvier",
      "https://orcid.org/0000-0001-9863-8851",
      "https://scholar.google.com/citations?user=Bkug2kUAAAAJ"
    ]

    [params.person.worksFor]
      name = "Odeai"
      url = "https://www.odeai.earth/"

[taxonomies]
  tag = "tags"

[languages]

  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 1

    [[languages.en.menu.main]]
      identifier = "posts"
      name = "Blog"
      url = "/posts/"
      weight = 0
    [[languages.en.menu.main]]
      identifier = "research"
      name = "Research"
      url = "/research/"
      weight = 1
    [[languages.en.menu.main]]
      identifier = "projects"
      name = "Projects"
      url = "/projects/"
      weight = 2
    [[languages.en.menu.main]]
      identifier = "about"
      name = "About me"
      url = "/about/"
      weight = 3

  [languages.fr]
    label = "Français"
    locale = "fr-FR"
    weight = 2
    description = "PhD | Co-fondateur d'Odeai"

    [[languages.fr.menu.main]]
      identifier = "posts"
      name = "Blog"
      url = "/posts/"
      weight = 0
    [[languages.fr.menu.main]]
      identifier = "research"
      name = "Recherche"
      url = "/research/"
      weight = 1
    [[languages.fr.menu.main]]
      identifier = "projects"
      name = "Projets"
      url = "/projects/"
      weight = 2
    [[languages.fr.menu.main]]
      identifier = "about"
      name = "À propos"
      url = "/a-propos/"
      weight = 3

[privacy]
  [privacy.youtube]
    disable = false
    privacyEnhanced = true

[markup]
  [markup.highlight]
    noClasses = false
