projects_description = "I dedicate my skills to initiatives that promote knowledge sharing, the reduction of inequalities and the sustainability of our energy consumption."

[hero-intro]
other = "I collaborate with scientists to research, create, and optimize scalable, ML-accelerated pipelines—ranging from Graph Neural Networks to Large Language Models to Diffusion Models—that help answer broad scientific questions. I hold a PhD from Inria in High-Performance Computing (HPC) and am specialized in scaling AI workloads from one GPU to hundreds. In tandem with these efforts, I like working on low-level performance characterization of GPU platforms. I am also interested in topics related to continual learning, big data analytics, large-scale pre-training, and reproducibility in computational sciences.<br><br>Currently, I am working at <a href=\"https://mdls.fr/\">Maison de la Simulation</a> preparing the arrival of the french exascale supercomputer <a href=\"https://www.franceinfo.fr/replay-radio/nouveau-monde/bienvenue-a-alice-recoque-le-premier-supercalculateur-exascale-francais_7617590.html\">Alice Recoque</a>.<br><br>The bigger picture is about climate change: I am passionate about finding solutions to the climate crisis we face, both in policy and through the development of software tools. This is the important topic on which as many people as possible should be working."

